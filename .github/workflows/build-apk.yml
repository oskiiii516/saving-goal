name: build-apk

# 打 tag（v1.4.0 这种）时自动构建 release APK，并挂到 Release 上
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    # 默认的 GITHUB_TOKEN 是只读的，不声明这个权限的话，最后一步挂 Release 会 403
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: 拉依赖
        run: flutter pub get
        working-directory: app

      - name: 静态检查与测试
        run: |
          flutter analyze
          # golden 是「视觉预览」，图是按 Windows 的微软雅黑渲染的，
          # Linux runner 上必然像素不一致，所以 CI 排除，只跑逻辑测试
          flutter test --exclude-tags golden
        working-directory: app

      - name: 构建 APK
        run: flutter build apk --release
        working-directory: app

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/app-release.apk
